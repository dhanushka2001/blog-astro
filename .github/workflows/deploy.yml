name: Deploy Astro Blog to GitHub Pages

on:
  push:
    branches: [main]  # Adjust if you're using another branch
    paths-ignore:
      - '**.md'       # Ignore README.md changes
  # pull_request:
  #   branches: [main]
  workflow_dispatch:

# Uncomment this for modern deployment
permissions:
  contents:  write  # allows git push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # -------- manual build to use Yarn 4 --------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Use Yarn 4.9.2
        run: corepack prepare yarn@4.9.2 --activate

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: |
            .yarn/install-state.gz
            node_modules
            .astro
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build site
        run: yarn build

      - name: Add .nojekyll file
        run: touch dist/.nojekyll
      # -----------------------------------------


      # -------- deploy with external repo ------
      # - name: Deploy to GitHub Pages via external repo 🚀
      #   uses: peaceiris/actions-gh-pages@v4
      #   with:
      #     personal_token: ${{ secrets.BLOG_TOKEN }}
      #     publish_dir: ./dist
      #     publish_branch: main
      #     external_repository: dhanushka2001/dhanushka2001.github.io
      #     user_name: 'github-actions[bot]'
      #     user_email: 'github-actions[bot]@users.noreply.github.com'
      # -----------------------------------------

      # ------ deploy with gh-pages branch ------
      - name: Deploy to GitHub Pages via gh-pages branch 🚀
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
      # -----------------------------------------
