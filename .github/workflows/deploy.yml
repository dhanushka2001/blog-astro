name: Deploy Astro Blog to GitHub Pages

on:
  push:
    branches: [main]  # Adjust if you're using another branch
    paths-ignore:
      - '**.md'       # Ignore README.md changes
  # pull_request:
  #   branches: [main]
  workflow_dispatch:

# Uncomment this for modern deployment
permissions:
  contents:  write  # allows git push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ---------------- auto -------------------
      # - name: Install, build, and upload site
      #   uses: withastro/action@v5
      #   with:
      #     node-version: 22
      #     package-manager: yarn
      # -----------------------------------------

      # ---------------- manual -----------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Use Yarn 4.9.2
        run: corepack prepare yarn@4.9.2 --activate

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: |
            .yarn/install-state.gz
            node_modules
            .astro
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build site
        run: yarn build

      - name: Add .nojekyll file
        run: touch dist/.nojekyll
      # -----------------------------------------


      # -------- deploy with external repo ------
      # - name: Deploy to GitHub Pages 🚀
      #   uses: peaceiris/actions-gh-pages@v4
      #   with:
      #     personal_token: ${{ secrets.BLOG_TOKEN }}
      #     publish_dir: ./dist
      #     publish_branch: main
      #     external_repository: dhanushka2001/dhanushka2001.github.io
      #     user_name: 'github-actions[bot]'
      #     user_email: 'github-actions[bot]@users.noreply.github.com'
      # -----------------------------------------


      # ------ deploy with gh-pages branch ------
      - name: Check if dist changed vs gh-pages
        id: dist_check
        run: |
          if ! git fetch origin gh-pages 2>/dev/null; then
            echo "No gh-pages branch yet — first deploy"
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          mkdir /tmp/gh-pages-current
          git --work-tree=/tmp/gh-pages-current checkout origin/gh-pages -- .

          if diff -rq dist/ /tmp/gh-pages-current/ > /dev/null 2>&1; then
            echo "No changes in dist/ — skipping deploy"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to gh-pages
        if: steps.dist_check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . --quiet
          fi

          cp -r dist/. .
          rm -rf dist
          git add .
          SHA=$(git rev-parse origin/main)
          git commit -m "deploy: https://github.com/${{ github.repository }}/commit/$SHA"
          git push origin gh-pages

      # -----------------------------------------
