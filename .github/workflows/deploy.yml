name: Deploy Astro Blog to GitHub Pages

on:
  push:
    branches: [main]  # Adjust if you're using another branch
    paths-ignore:
      - '**.md'       # Ignore README.md changes
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Use Yarn 4.9.2
        run: corepack prepare yarn@4.9.2 --activate

      - name: Cache Yarn PnP
        uses: actions/cache@v3
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
            .pnp.cjs
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build site
        run: yarn build

      - name: Add .nojekyll file
        run: echo > dist/.nojekyll

      - name: Set Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy to GitHub Pages 🚀
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.BLOG_TOKEN }}
          publish_dir: ./dist
          publish_branch: main
          external_repository: dhanushka2001/dhanushka2001.github.io
